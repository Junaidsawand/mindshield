name: mindshield
description: "AI-powered SMS cybersecurity application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0

  # SMS (read inbox; RECEIVE_SMS via BroadcastReceiver added in permissions module)
  flutter_sms_inbox: ^1.0.4

  # Permissions
  permission_handler: ^11.3.1

  # Assets / icons
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
